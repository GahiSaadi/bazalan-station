<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bazalan Station — Field</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#132029; --steel:#2c4456; --paper:#f2f5f4; --card:#ffffff;
    --amber:#efa300; --amber-deep:#c47f00; --green:#2e7d5b; --red:#c1443c; --line:#dbe1e0; --muted:#5c6b71;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.2px;}
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    background:var(--ink); color:#fff; padding:16px 20px;
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:20;
  }
  .gauge{width:30px; height:30px; border-radius:50%; border:3px solid var(--amber); position:relative; flex:none;}
  .gauge::after{content:''; position:absolute; top:50%; left:50%; width:9px; height:2px; background:var(--amber); transform-origin:left center; transform:rotate(-40deg) translateY(-1px);}
  .brand-name{font-family:'Barlow Condensed'; font-weight:700; font-size:20px; line-height:1;}
  .brand-sub{font-size:11px; color:#aebac1;}

  main{flex:1; padding:18px 18px 100px;}
  .screen{display:none;}
  .screen.active{display:block; animation:rise .28s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .field{margin-bottom:16px;}
  label{display:block; font-size:13px; font-weight:600; color:var(--steel); margin-bottom:6px;}
  input[type=text],input[type=number],select,textarea{
    width:100%; padding:14px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:16px; font-family:inherit; background:#fff; color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
  textarea{resize:vertical; min-height:70px;}
  .hint{font-size:12px; color:var(--muted); margin-top:5px;}
  .error-text{font-size:12.5px; color:var(--red); margin-top:5px; font-weight:600;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:16px; border-radius:12px; border:none; cursor:pointer;
    font-size:16px; font-weight:700; font-family:'Inter'; transition:transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--amber); color:#231600;}
  .btn-primary:disabled{background:#e6c98a; color:#8a7238; cursor:not-allowed;}
  .btn-outline{background:#fff; border:1.5px solid var(--line); color:var(--ink);}
  .btn-danger-outline{background:#fff; border:1.5px solid var(--red); color:var(--red);}

  .card{background:var(--card); border-radius:var(--radius); padding:20px; border:1px solid var(--line);}

  .action-tile{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left;
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:22px; margin-bottom:14px; cursor:pointer;
  }
  .action-tile:active{border-color:var(--amber);}
  .tile-icon{
    width:56px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:26px; flex:none;
  }
  .tile-in .tile-icon{background:#e4f3ec; color:var(--green);}
  .tile-out .tile-icon{background:#fdece9; color:var(--red);}
  .tile-tr .tile-icon{background:#eef2f8; color:var(--steel);}
  .tile-title{font-family:'Barlow Condensed'; font-weight:700; font-size:20px;}
  .tile-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}

  .progress{display:flex; gap:6px; margin-bottom:22px;}
  .progress span{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .progress span.done{background:var(--amber);}

  .step-label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-bottom:4px;}
  .step-title{font-size:24px; margin:0 0 20px;}

  .choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choice-btn{
    padding:16px 10px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    font-weight:700; font-family:'Barlow Condensed'; font-size:16px; cursor:pointer; text-align:center;
  }
  .choice-btn.selected{border-color:var(--amber); background:#fff7e8; color:var(--amber-deep);}

  .photo-box{
    border:2px dashed var(--line); border-radius:12px; padding:16px; text-align:center; margin-bottom:10px;
  }
  .photo-box.has-photo{border-style:solid; border-color:var(--green); padding:0; overflow:hidden;}
  .photo-box img{width:100%; display:block; max-height:220px; object-fit:cover;}
  .photo-actions{display:flex; gap:10px; margin-top:10px;}
  .photo-row{display:flex; gap:10px;}
  .photo-row .btn{font-size:13.5px; padding:12px 8px;}

  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg, rgba(242,245,244,0) 0%, var(--paper) 30%);
    max-width:520px; margin:0 auto;
  }
  .bottom-bar-inner{display:flex; gap:10px;}
  .bottom-bar .btn-outline{flex:0 0 90px;}

  .summary-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14.5px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--muted);}
  .summary-row .v{font-weight:600; text-align:right;}

  .confirm-wrap{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:40px;}
  .confirm-badge{width:76px; height:76px; border-radius:50%; background:#e4f3ec; color:var(--green); display:flex; align-items:center; justify-content:center; font-size:36px; margin-bottom:20px;}
  .ref{font-family:'Barlow Condensed'; font-size:15px; color:var(--muted); background:#fff; border:1px solid var(--line); padding:8px 14px; border-radius:8px; margin-top:14px;}

  .banner{padding:12px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px; font-weight:600;}
  .banner-error{background:#fdece9; color:var(--red);}
  .banner-info{background:#eef2f8; color:var(--steel);}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:12px 18px; border-radius:10px; font-size:13.5px; z-index:50; max-width:88%; text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }

  .spinner{width:16px; height:16px; border:2.5px solid rgba(0,0,0,.15); border-top-color:currentColor; border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Desktop / wider screens: use the available width,
     keep it professional rather than a stretched phone layout ---------- */
  @media (min-width: 760px){
    #app{max-width:840px;}
    .topbar{padding:20px 34px;}
    main{padding:34px 34px 60px;}
    #screen-home .action-tile{
      display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start;
      text-align:left; padding:26px 22px;
    }
    #screen-home .home-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
    #screen-home .tile-icon{margin-bottom:6px;}
    #screen-wizard{max-width:520px; margin:0 auto;}
    .bottom-bar{max-width:520px;}
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="gauge"></div>
    <div>
      <div class="brand-name">BAZALAN</div>
      <div class="brand-sub">Field operations</div>
    </div>
  </div>

  <main>

    <!-- HOME -->
    <section class="screen active" id="screen-home">
      <h2 class="step-title" style="margin-top:6px;">New operation</h2>
      <div class="home-grid">
        <button class="action-tile tile-in" data-type="INPUT">
          <div class="tile-icon">⬇</div>
          <div><div class="tile-title">Input</div><div class="tile-sub">Material or vehicle received</div></div>
        </button>
        <button class="action-tile tile-out" data-type="OUTPUT">
          <div class="tile-icon">⬆</div>
          <div><div class="tile-title">Output</div><div class="tile-sub">Material or vehicle leaving</div></div>
        </button>
        <button class="action-tile tile-tr" data-type="TRANSFER">
          <div class="tile-icon">⇄</div>
          <div><div class="tile-title">Transfer</div><div class="tile-sub">Vehicle sent to another station</div></div>
        </button>
      </div>
      <div id="homeBanner" style="margin-top:16px;"></div>
    </section>

    <!-- WIZARD -->
    <section class="screen" id="screen-wizard">
      <div class="progress" id="wizardProgress"></div>
      <div id="wizardBanner"></div>
      <div id="wizardStep"></div>
    </section>

    <!-- CONFIRMATION -->
    <section class="screen" id="screen-confirm">
      <div class="confirm-wrap">
        <div class="confirm-badge">✓</div>
        <h2 class="step-title" style="margin-bottom:6px;">Operation submitted successfully</h2>
        <p class="hint">The office can now see this record.</p>
        <div class="ref" id="confirmRef"></div>
        <button class="btn btn-primary" style="margin-top:28px; max-width:260px;" id="confirmDoneBtn">New operation</button>
      </div>
    </section>

  </main>

  <div class="bottom-bar" id="wizardBar" style="display:none;">
    <div class="bottom-bar-inner">
      <button class="btn btn-outline" id="wizardBack">Back</button>
      <button class="btn btn-primary" id="wizardNext">Next</button>
    </div>
  </div>

</div>

<script>
/* =====================================================================
   CONFIGURATION — put your Supabase project values here.
   Find them in Supabase Dashboard -> Project Settings -> API.
   Only the public "anon" key ever goes in frontend code — never the
   service_role / secret key. This site never signs in; the anon key
   plus the database's own security rules are what keep it safe (see
   database/schema.sql).
   ===================================================================== */
const SUPABASE_URL = "https://uctynyscbeunhjsawtzd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjdHlueXNjYmV1bmhqc2F3dHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTIxNTUsImV4cCI6MjEwNTk4ODE1NX0.c457jV2CVnXNVfQPBu77-G1_R8wcLDnSo9pQdYpoC88";
const PHOTO_BUCKET = "operation-photos";
/* ===================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false } // no login on this site — nothing to persist
});

let vehicleTypes = [];
let tanks = [];
let stations = [];

const state = {
  type: null,     // INPUT | OUTPUT | TRANSFER
  step: 0,
  data: {},
  photos: {}       // { vehicle: File, meter: File, transfer_paper: File }
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function showScreen(id){
  $$('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
  $('#wizardBar').style.display = (id === 'screen-wizard') ? 'block' : 'none';
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function bannerHTML(msg, type='error'){
  return `<div class="banner banner-${type}">${msg}</div>`;
}

/* ---------------- REFERENCE DATA (public read, no login) ---------------- */

async function loadReferenceData(){
  const [vt, tk, st] = await Promise.all([
    sb.from('vehicle_types').select('*').eq('active', true).order('sort_order'),
    sb.from('tanks').select('*').eq('active', true).order('sort_order'),
    sb.from('stations').select('*').eq('active', true).order('sort_order')
  ]);
  if(vt.error || tk.error || st.error){
    $('#homeBanner').innerHTML = bannerHTML('Could not load station lists. Check your internet connection and reload the page.');
    return;
  }
  vehicleTypes = vt.data || [];
  tanks = tk.data || [];
  stations = st.data || [];
}

/* ---------------- HOME -> WIZARD ---------------- */

$$('.action-tile').forEach(tile => {
  tile.addEventListener('click', () => startWizard(tile.dataset.type));
});

function stepsFor(type){
  if(type === 'TRANSFER') return ['driver','plate','destination','photo_transfer','review'];
  return ['vehicle','tank','driver','plate','quantity','photo_vehicle','photo_meter','review'];
}

function startWizard(type){
  state.type = type;
  state.step = 0;
  state.data = { operation_type: type };
  state.photos = {};
  showScreen('screen-wizard');
  renderStep();
}

function renderProgress(){
  const steps = stepsFor(state.type);
  $('#wizardProgress').innerHTML = steps.map((_, i) =>
    `<span class="${i <= state.step ? 'done' : ''}"></span>`).join('');
}

function fieldError(msg){
  return `<div class="error-text">${msg}</div>`;
}

function renderStep(){
  renderProgress();
  $('#wizardBanner').innerHTML = '';
  const steps = stepsFor(state.type);
  const key = steps[state.step];
  const d = state.data;
  const label = { INPUT:'Input operation', OUTPUT:'Output operation', TRANSFER:'Transfer operation' }[state.type];
  let html = '';

  if(key === 'vehicle'){
    html = `<div class="step-label">${label}</div><h2 class="step-title">Vehicle / material type</h2>
      <div class="choice-grid">${vehicleTypes.map(v =>
        `<button class="choice-btn ${d.vehicle_type===v.name?'selected':''}" data-val="${v.name}">${v.name}</button>`
      ).join('')}</div>`;
  } else if(key === 'tank'){
    html = `<div class="step-label">${label}</div><h2 class="step-title">Select tank</h2>
      <div class="choice-grid">${tanks.map(t =>
        `<button class="choice-btn ${d.tank_id===t.id?'selected':''}" data-val="${t.id}">${t.tank_name}</button>`
      ).join('')}</div>`;
  } else if(key === 'driver'){
    html = `<div class="step-label">${label}</div><h2 class="step-title">Driver name</h2>
      <div class="field"><input type="text" id="inpDriver" value="${d.driver_name||''}" placeholder="Full name" autofocus></div>`;
  } else if(key === 'plate'){
    html = `<div class="step-label">${label}</div><h2 class="step-title">Vehicle plate number</h2>
      <div class="field"><input type="text" id="inpPlate" value="${d.plate_number||''}" placeholder="e.g. AB 1234" autofocus></div>`;
  } else if(key === 'destination'){
    html = `<div class="step-label">${label}</div><h2 class="step-title">Destination station</h2>
      <div class="choice-grid">${stations.map(s =>
        `<button class="choice-btn ${d.destination_station===s.station_name?'selected':''}" data-val="${s.station_name}">${s.station_name}</button>`
      ).join('')}</div>
      <div class="field" style="margin-top:16px;"><label>Notes (optional)</label>
      <textarea id="inpNotes">${d.notes||''}</textarea></div>`;
  } else if(key === 'quantity'){
    html = `<div class="step-label">${label}</div><h2 class="step-title">Meter / quantity</h2>
      <div class="field"><label>Numerical value shown on the meter</label>
      <input type="number" inputmode="decimal" id="inpQty" value="${d.quantity??''}" placeholder="0.00"></div>
      <div class="field"><label>Unit</label>
      <div class="choice-grid">
        <button class="choice-btn ${d.unit==='Liter'?'selected':''}" data-unit="Liter">Liter</button>
        <button class="choice-btn ${d.unit==='Kilogram'?'selected':''}" data-unit="Kilogram">Kilogram</button>
      </div></div>`;
  } else if(key === 'photo_vehicle'){
    html = photoStepHTML('vehicle', 'Vehicle photo', 'Photo of the vehicle involved in this operation.');
  } else if(key === 'photo_meter'){
    html = photoStepHTML('meter', 'Meter photo', 'Photo clearly showing the numerical meter reading.');
  } else if(key === 'photo_transfer'){
    html = photoStepHTML('transfer_paper', 'Transfer document photo', 'Photo of the transfer paper/document.');
  } else if(key === 'review'){
    html = renderReview();
  }

  $('#wizardStep').innerHTML = html;
  bindStepEvents(key);
  $('#wizardNext').textContent = (key === 'review') ? 'Submit operation' : 'Next';
  $('#wizardNext').disabled = false;
}

function photoStepHTML(type, title, sub){
  const file = state.photos[type];
  const preview = file ? `<div class="photo-box has-photo"><img src="${file.previewUrl}"></div>
    <div class="photo-row"><button class="btn btn-outline" data-retake="${type}">↺ Retake</button>
    <button class="btn btn-danger-outline" data-remove="${type}">✕ Remove</button></div>`
    : `<div class="photo-box"><p class="hint" style="margin:0 0 12px;">${sub}</p>
    <div class="photo-row">
      <button class="btn btn-outline" data-capture="${type}">📷 Take photo</button>
      <button class="btn btn-outline" data-upload="${type}">📁 Upload photo</button>
    </div></div>
    <input type="file" accept="image/*" capture="environment" style="display:none" id="cap_${type}">
    <input type="file" accept="image/*" style="display:none" id="up_${type}">`;
  return `<div class="step-label">${state.type === 'TRANSFER' ? 'Transfer operation' : (state.type + ' operation')}</div>
    <h2 class="step-title">${title}</h2>${preview}<div id="photoErr_${type}"></div>`;
}

function renderReview(){
  const d = state.data;
  const rows = [];
  if(state.type === 'TRANSFER'){
    rows.push(['Type','Transfer'], ['Driver', d.driver_name], ['Plate', d.plate_number],
      ['Destination', d.destination_station], ['Notes', d.notes || '—']);
  } else {
    const tankName = (tanks.find(t=>t.id===d.tank_id)||{}).tank_name || '';
    rows.push(['Type', state.type], ['Vehicle/material', d.vehicle_type], ['Tank', tankName],
      ['Driver', d.driver_name], ['Plate', d.plate_number], ['Quantity', d.quantity], ['Unit', d.unit]);
  }
  return `<div class="step-label">Review</div><h2 class="step-title">Confirm details</h2>
    <div class="card">${rows.map(([k,v]) => `<div class="summary-row"><span class="k">${k}</span><span class="v">${v ?? '—'}</span></div>`).join('')}
    </div>
    <p class="hint" style="margin-top:14px;">Date/time will be recorded automatically as ${new Date().toLocaleString()}.</p>`;
}

function bindStepEvents(key){
  $$('.choice-btn[data-val]').forEach(btn => btn.addEventListener('click', () => {
    if(key === 'vehicle') state.data.vehicle_type = btn.dataset.val;
    if(key === 'tank') state.data.tank_id = btn.dataset.val;
    if(key === 'destination') state.data.destination_station = btn.dataset.val;
    renderStep();
  }));
  $$('.choice-btn[data-unit]').forEach(btn => btn.addEventListener('click', () => {
    state.data.unit = btn.dataset.unit; renderStep();
  }));
  if(key === 'photo_vehicle' || key === 'photo_meter' || key === 'photo_transfer'){
    const type = key.replace('photo_','');
    bindPhotoInputs(type);
  }
}

function bindPhotoInputs(type){
  const capBtn = document.querySelector(`[data-capture="${type}"]`);
  const upBtn = document.querySelector(`[data-upload="${type}"]`);
  const capInput = $(`#cap_${type}`);
  const upInput = $(`#up_${type}`);
  const retakeBtn = document.querySelector(`[data-retake="${type}"]`);
  const removeBtn = document.querySelector(`[data-remove="${type}"]`);
  if(capBtn) capBtn.addEventListener('click', () => capInput.click());
  if(upBtn) upBtn.addEventListener('click', () => upInput.click());
  if(capInput) capInput.addEventListener('change', (e) => handlePhotoFile(type, e.target.files[0]));
  if(upInput) upInput.addEventListener('change', (e) => handlePhotoFile(type, e.target.files[0]));
  if(retakeBtn) retakeBtn.addEventListener('click', () => { delete state.photos[type]; renderStep(); });
  if(removeBtn) removeBtn.addEventListener('click', () => { delete state.photos[type]; renderStep(); });
}

async function handlePhotoFile(type, file){
  if(!file) return;
  $(`#photoErr_${type}`).innerHTML = '';
  try {
    const compressed = await compressImage(file, 1600, 0.8);
    compressed.previewUrl = URL.createObjectURL(compressed);
    state.photos[type] = compressed;
    renderStep();
  } catch(err){
    $(`#photoErr_${type}`).innerHTML = fieldError('Could not process the photo. Please try again.');
  }
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        if(!blob){ reject(new Error('compress failed')); return; }
        const out = new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' });
        resolve(out);
      }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- NAVIGATION ---------------- */

$('#wizardBack').addEventListener('click', () => {
  if(state.step === 0){ showScreen('screen-home'); return; }
  state.step--; renderStep();
});

$('#wizardNext').addEventListener('click', async () => {
  const steps = stepsFor(state.type);
  const key = steps[state.step];
  const err = validateStep(key);
  if(err){ $('#wizardBanner').innerHTML = bannerHTML(err); return; }
  if(key === 'review'){
    await submitOperation();
    return;
  }
  state.step++;
  renderStep();
});

function validateStep(key){
  const d = state.data;
  if(key === 'vehicle' && !d.vehicle_type) return 'Please select the vehicle/material type.';
  if(key === 'tank' && !d.tank_id) return 'Please select a tank.';
  if(key === 'driver'){ d.driver_name = $('#inpDriver').value.trim(); if(!d.driver_name) return 'Please enter the driver name.'; }
  if(key === 'plate'){ d.plate_number = $('#inpPlate').value.trim(); if(!d.plate_number) return 'Please enter the vehicle plate.'; }
  if(key === 'destination'){
    d.notes = $('#inpNotes').value.trim();
    if(!d.destination_station) return 'Please select a destination station.';
  }
  if(key === 'quantity'){
    d.quantity = $('#inpQty').value;
    if(d.quantity === '' || isNaN(d.quantity)) return 'Please enter the quantity.';
    if(!d.unit) return 'Please select a unit.';
  }
  if(key === 'photo_vehicle' && !state.photos.vehicle) return 'Please upload the vehicle photo.';
  if(key === 'photo_meter' && !state.photos.meter) return 'Please upload the meter photo.';
  if(key === 'photo_transfer' && !state.photos.transfer_paper) return 'Please upload the transfer document photo.';
  return null;
}

/* ---------------- SUBMIT: secure RPC, no direct table access ---------------- */

async function submitOperation(){
  $('#wizardNext').disabled = true;
  $('#wizardNext').innerHTML = '<span class="spinner"></span>';
  const now = new Date();
  const d = state.data;

  const { data: opId, error } = await sb.rpc('submit_operation', {
    p_operation_type: state.type,
    p_vehicle_type: d.vehicle_type || null,
    p_plate_number: d.plate_number || null,
    p_driver_name: d.driver_name || null,
    p_tank_id: d.tank_id || null,
    p_material: d.vehicle_type || null,
    p_quantity: d.quantity !== undefined && d.quantity !== '' ? Number(d.quantity) : null,
    p_unit: d.unit || null,
    p_operation_date: now.toISOString().slice(0,10),
    p_operation_time: now.toTimeString().slice(0,8),
    p_destination_station: d.destination_station || null,
    p_notes: d.notes || null
  });

  if(error){
    resetSubmitButton();
    $('#wizardBanner').innerHTML = bannerHTML('Could not save the operation: ' + error.message);
    return;
  }

  const photoEntries = Object.entries(state.photos);
  for(const [type, file] of photoEntries){
    const path = `anonymous/${opId}/${type}-${Date.now()}.jpg`;
    const { error: upErr } = await sb.storage.from(PHOTO_BUCKET).upload(path, file, { contentType:'image/jpeg' });
    if(upErr){
      $('#wizardBanner').innerHTML = bannerHTML('Upload failed for a photo. Please try submitting again.');
      resetSubmitButton();
      return;
    }
    const { error: attachErr } = await sb.rpc('attach_operation_photo', {
      p_operation_id: opId, p_photo_type: type, p_storage_path: path
    });
    if(attachErr){
      $('#wizardBanner').innerHTML = bannerHTML('Could not attach a photo. Please try submitting again.');
      resetSubmitButton();
      return;
    }
  }

  $('#confirmRef').textContent = 'Reference: ' + opId.slice(0,8).toUpperCase();
  showScreen('screen-confirm');
  resetSubmitButton();
}

function resetSubmitButton(){
  $('#wizardNext').disabled = false;
  $('#wizardNext').textContent = 'Submit operation';
}

$('#confirmDoneBtn').addEventListener('click', () => {
  showScreen('screen-home');
});

/* ---------------- BOOT (no login step at all) ---------------- */

(async function boot(){
  await loadReferenceData();
})();
</script>
